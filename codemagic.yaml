# Build iOS via Codemagic (Mac dans le cloud) — alternative si vous n'avez pas de Mac.
# Compte: https://codemagic.io + Apple Developer Program requis pour signer.
workflows:
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.cofipointe.app
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cofipointe.app
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Install pods
        script: |
          cd ios
          pod install
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
